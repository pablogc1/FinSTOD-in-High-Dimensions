run_tag: "test2_bickley_pure_shear_shift1"
output_dir: "cesvima_output"
description: "Unperturbed Bickley jet, grid offset by +1 cell (origin-shift pair with test2_bickley_pure_shear)"

system:
  name: "bickley_jet"
  U: 1.0
  L: 1.0
  eps: [0.0, 0.0, 0.0]
  dt_out: 0.04

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]
  cell_offset: 1

n_levels: 1500
rule: "strict"
num_shards: 60
compute_ftle: true

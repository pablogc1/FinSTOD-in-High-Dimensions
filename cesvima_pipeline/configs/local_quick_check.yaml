# Quick local test (runs in ~1-2s)
run_tag: "local_quick_test"
output_dir: "cesvima_output"

system:
  name: "lorenz96"
  m: 4
  F: 8.0
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 100
  stride: 5             # 20 x 20 = 400 cells
  axes: [0, 1]

n_levels: 200
num_shards: 4           # 4 shards of 100 cells each
q: null                 # q=m
rule: "strict"
compute_ftle: true

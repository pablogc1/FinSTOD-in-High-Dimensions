run_tag: "prod_lorenz96_m32"
output_dir: "cesvima_output"
description: "Lorenz-96 in 32 dimensions (m=32) — Prohibitive for variational tangent-space FTLE"

system:
  name: "lorenz96"
  m: 32
  F: 8.0
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 2500
rule: "strict"
num_shards: 60
compute_ftle: false

# Unperturbed Bickley at twice the production window (τ=120).
run_tag: "interp_bickley_pure_long"
output_dir: "cesvima_output"
description: "Pure-shear Bickley 1000x1000 at tau=120"

system:
  name: "bickley_jet"
  U: 1.0
  L: 1.0
  eps: [0.0, 0.0, 0.0]
  dt_out: 0.04

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 3000
rule: "strict"
num_shards: 60
compute_ftle: true

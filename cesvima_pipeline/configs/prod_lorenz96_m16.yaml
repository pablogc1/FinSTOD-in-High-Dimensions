run_tag: "prod_lorenz96_m16"
output_dir: "cesvima_output"
description: "Lorenz-96 in 16 dimensions (m=16) continuous spatiotemporal chaos"

system:
  name: "lorenz96"
  m: 16
  F: 8.0
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 2500
rule: "strict"
num_shards: 60
compute_ftle: true

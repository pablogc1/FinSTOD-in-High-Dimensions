run_tag: "prod_froeschle_dof3_m6"
output_dir: "cesvima_output"
description: "Froeschle Coupled Symplectic Flow (dof=3, m=6) probing Arnold diffusion"

system:
  name: "froeschle"
  dof: 3
  K: 0.20
  dt_out: 0.01

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 2500
rule: "strict"
num_shards: 60
compute_ftle: true

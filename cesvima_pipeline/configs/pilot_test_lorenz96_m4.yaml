# Pilot Canary Test: Lorenz 96 (m=4)
# Run time: ~5-10 seconds total across 10 workers
run_tag: "pilot_lorenz96_m4"
output_dir: "cesvima_output"

system:
  name: "lorenz96"
  m: 4
  F: 8.0
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 400
  stride: 4             # 100 x 100 = 10,000 cells
  axes: [0, 1]

n_levels: 1000
num_shards: 10          # 10 array tasks of 1,000 cells each
q: null                 # Published rule q=m
rule: "strict"
compute_ftle: true

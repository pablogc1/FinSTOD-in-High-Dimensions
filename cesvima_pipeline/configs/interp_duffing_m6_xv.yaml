# Coupled Duffing m=6 on the (x1, v1) plane of oscillator 1, τ=20.
run_tag: "interp_duffing_m6_xv"
output_dir: "cesvima_output"
description: "Coupled Duffing d=3 on (x1, v1) at tau=20"

system:
  name: "coupled_duffing"
  d: 3
  kappa: 0.15
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 3]

n_levels: 10000
num_shards: 60
q: null
rule: "strict"
compute_ftle: true

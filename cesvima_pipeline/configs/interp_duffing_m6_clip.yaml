# Same grid/window as production coupled Duffing, with clip-to-grid FinSTOD.
run_tag: "interp_duffing_m6_clip"
output_dir: "cesvima_output"
description: "Coupled Duffing tau=4 with domain clipping (reviewer Duffing curation)"

system:
  name: "coupled_duffing"
  d: 3
  kappa: 0.15
  dt_out: 0.002

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 2000
num_shards: 60
q: null
rule: "strict"
compute_ftle: true
clip_to_grid: true

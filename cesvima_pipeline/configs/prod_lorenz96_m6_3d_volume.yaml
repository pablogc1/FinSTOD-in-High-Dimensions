run_tag: "prod_lorenz96_m6_3d_volume"
output_dir: "cesvima_output"
description: "Lorenz-96 (m=6) 3D Subspace Volume (100x100x100 on y1, y2, y3)"

system:
  name: "lorenz96"
  m: 6
  F: 8.0
  dt_out: 0.002

grid:
  mode: "volume_3d"
  n_cells: 100
  stride: 1
  axes: [0, 1, 2]

n_levels: 2000
rule: "strict"
num_shards: 75
compute_ftle: false

# Tiny ABC template for tau-series dry runs. Not a production tag.
run_tag: "toy_abc_flow"
output_dir: "cesvima_output"
description: "Toy ABC 20x20 for pipeline tau-series checks"

system:
  name: "abc"
  A: 1.0
  B: 1.0
  C: 1.0
  dt_out: 0.01

grid:
  mode: "slice"
  n_cells: 40
  stride: 2
  axes: [0, 1]

n_levels: 50
rule: "strict"
num_shards: 2
compute_ftle: true

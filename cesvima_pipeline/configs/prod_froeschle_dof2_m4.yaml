run_tag: "prod_froeschle_dof2_m4"
output_dir: "cesvima_output"
description: "Froeschle Coupled Symplectic Flow (dof=2, m=4) with KAM tori & resonance web"

system:
  name: "froeschle"
  dof: 2
  K: 0.30
  dt_out: 0.01

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 2500
rule: "strict"
num_shards: 60
compute_ftle: true

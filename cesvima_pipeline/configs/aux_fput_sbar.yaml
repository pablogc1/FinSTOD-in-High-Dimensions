# Full-grid FPUT modal spectral entropy (mean S-bar + tau_eq).
#
# Re-integrates existing FinSTOD shards. Does not open or overwrite
# prod_fput_m8 / prod_fput_m8_tau* FinSTOD fields.
#
# Not part of `all`. Activate with:
#   sbatch --export=ALL,PHASES="12" master_pipeline.slurm
#   sbatch --export=ALL,CFG=configs/aux_fput_sbar.yaml master_pipeline.slurm
#
# Sequential 60-shard arrays (account cap 200). Output:
#   cesvima_output/aux_sbar_<source_tag>/results_consolidated.npz

kind: fput_sbar_aux
aux_kind: fput_lifetime
aux_prefix: aux_sbar_
description: "FPUT m=8 modal S-bar on existing 1000x1000 FinSTOD runs"
sources: ["prod_fput_m8_tau05", "prod_fput_m8_tau10", "prod_fput_m8_tau15", "prod_fput_m8_tau20", "prod_fput_m8"]

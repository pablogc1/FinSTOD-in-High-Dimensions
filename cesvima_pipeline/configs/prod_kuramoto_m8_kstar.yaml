run_tag: "prod_kuramoto_m8_kstar"
output_dir: "cesvima_output"
description: "Kuramoto m=8 K=0.7 R=2, 1000x1000, pair_kstar stored (does not overwrite prod_kuramoto_m8)"

system:
  name: "kuramoto"
  m: 8
  K: 0.70
  coupling: "ring"
  radius: 2
  freq_spread: 1.0
  dt_out: 0.01

grid:
  mode: "slice"
  n_cells: 1000
  stride: 1
  axes: [0, 1]

n_levels: 1500
rule: "strict"
num_shards: 60
compute_ftle: true
store_pair_diagnostics: true
